[package]
name = "repo-conformance"
description = "The BDD runner and the honesty meta-gate. Dev and CI only; never a dependency of a shipped crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
repo-model = { workspace = true }

# The parity test reads the SDK's verification evidence (JSON) and binds it to
# the program under test by SHA-256. Same pins as xtask, so the locked crate set
# does not grow.
[dev-dependencies]
serde_json = "1.0.151"
sha2 = "0.10.9"

[lints]
workspace = true
