name: propose template update

on:
  workflow_dispatch:
    inputs:
      sdk-image:
        required: true
        type: string
      target-ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.target-ref }}
      - name: lock
        env:
          SDK_IMAGE: ${{ inputs.sdk-image }}
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/workspace" --workdir /workspace "$SDK_IMAGE" lexlean lock
          echo LOCKB64BEGIN; gzip -9 < lexlean.lock | base64 -w0; echo; echo LOCKB64END
          exit 1
