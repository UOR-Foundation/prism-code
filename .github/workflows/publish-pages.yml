# Publishes the verified browser view to GitHub Pages
# (https://uor-foundation.github.io/prism-code/). Adapted from the PrismPM
# starter action/starter/publish-pages.yml (PrismPM#205). Main pushes and
# release tags only; never pull requests. One job on one runner.
#
# No `fetch` step: building the browser view needs only the SDK image, as in
# the bootstrap gate, while `fetch --locked` downloads every standards
# authority, including OSV snapshot generations the publisher has since
# deleted (404), so it fails without affecting what is published.
name: pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: build, check and deploy the browser application
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      pages: write
    steps:
      - name: Check out the exact event revision without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: lock
        name: Resolve the locked SDK image and the local build destination
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          image=$(sed -n 's/.*"sdk_image":"\([^"]*\)".*/\1/p' prismpm.lock)
          if [[ ! $image =~ ^[a-z0-9.-]+(:[0-9]{1,5})?/[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'prismpm.lock does not select an immutable SDK image' >&2
            exit 64
          fi
          printf 'sdk-image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          # The tagged destination names the local release only; nothing is pushed.
          printf 'reference=ghcr.io/%s:pages\n' "${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Diagnose the build inside the SDK image
        shell: bash
        env:
          IMAGE: ${{ steps.lock.outputs.sdk-image }}
          REF: ${{ steps.lock.outputs.reference }}
        run: |
          set -uo pipefail
          for cmd in "build --locked --tag $REF $GITHUB_WORKSPACE"; do
            echo "== prismpm $cmd"
            docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp/prismpm-home --env PRISMPM_EPHEMERAL_HOME=1 \
              --env BUILDX_CONFIG=/tmp/prismpm-buildx --tmpfs /tmp:rw,exec,nosuid,size=2g --cap-drop ALL \
              --security-opt no-new-privileges --network none --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
              "$IMAGE" prismpm --json $cmd; echo "exit $?"
          done
          exit 1
