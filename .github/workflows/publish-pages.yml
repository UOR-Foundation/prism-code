# Publishes the verified browser view to GitHub Pages
# (https://uor-foundation.github.io/prism-code/). Main pushes and release tags
# only; never pull requests. One job on one runner.
#
# The application is checked, built and verified through the locked SDK exactly
# as the bootstrap gate does (`prismpm check`, `build`, `verify`), and the
# verified `view/browser` closure is what is uploaded. `prismpm verify` holds
# that closure to the build manifest and every acceptance vector before upload.
# The SDK action's `publish-pages` command is not used: it builds `--locked`,
# which needs `fetch --locked` to fill the authority cache, and that fetch fails
# on standards.lock OSV snapshot URLs the publisher has deleted
# (UOR-Foundation/PrismPM#374).
name: pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: build, check and deploy the browser application
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      pages: write
    steps:
      - name: Check out the exact event revision without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pages
        name: Check, build and verify through the locked SDK, then stage the browser view
        shell: bash
        run: |
          set -euo pipefail
          image=$(sed -n 's/.*"sdk_image":"\([^"]*\)".*/\1/p' prismpm.lock)
          if [[ ! $image =~ ^[a-z0-9.-]+(:[0-9]{1,5})?/[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'prismpm.lock does not select an immutable SDK image' >&2
            exit 64
          fi
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,exec,nosuid,size=2g \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume "$PWD:$PWD" \
            --workdir "$PWD" \
            --env HOME=/tmp/prismpm-home \
            --env PRISMPM_EPHEMERAL_HOME=1 \
            "$image" bash -c 'set -euo pipefail; prismpm check; prismpm build; prismpm verify'
          browser=$(ls -td .prism/build/*/view/browser | head -n 1)
          test -f "$browser/index.html"
          mkdir -p _site
          cp -a "$browser"/. _site/
          ls -l _site
          printf 'pages-path=_site\n' >> "$GITHUB_OUTPUT"
