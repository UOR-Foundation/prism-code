# Publishes the browser view to GitHub Pages
# (https://uor-foundation.github.io/prism-code/) once the bootstrap gate has
# passed on a main push. One job on one runner.
#
# The gate already ran `prismpm verify` (every acceptance vector, the browser
# closure against the build manifest) on this exact commit on both
# architectures, so this job only checks and builds the same commit through the
# same locked SDK and uploads its `view/browser` closure. Tags add nothing: a
# tag points at a main commit that is already deployed.
#
# The SDK action's `publish-pages` command is not used: it builds `--locked`,
# which needs `fetch --locked` to fill the authority cache, and that fetch fails
# on standards.lock OSV snapshot URLs the publisher has deleted
# (UOR-Foundation/PrismPM#374).
name: pages

on:
  workflow_run:
    workflows: [bootstrap]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: build, check and deploy the browser application
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      id-token: write
      pages: write
    steps:
      - name: Check out the exact event revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: pages
        name: Check and build through the locked SDK, then stage the browser view
        shell: bash
        run: |
          set -euo pipefail
          image=$(sed -n 's/.*"sdk_image":"\([^"]*\)".*/\1/p' prismpm.lock)
          if [[ ! $image =~ ^[a-z0-9.-]+(:[0-9]{1,5})?/[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'prismpm.lock does not select an immutable SDK image' >&2
            exit 64
          fi
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,exec,nosuid,size=2g \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume "$PWD:$PWD" \
            --workdir "$PWD" \
            --env HOME=/tmp/prismpm-home \
            --env PRISMPM_EPHEMERAL_HOME=1 \
            "$image" bash -c 'set -euo pipefail; prismpm check; prismpm build'
          browser=$(ls -td .prism/build/*/view/browser | head -n 1)
          test -f "$browser/index.html"
          mkdir -p _site
          cp -a "$browser"/. _site/
          ls -l _site
          printf 'pages-path=_site\n' >> "$GITHUB_OUTPUT"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload the checked closure as the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ steps.pages.outputs.pages-path }}
      - id: deployment
        name: Deploy the uploaded closure without rebuilding
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
