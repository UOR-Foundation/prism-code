# Scratch harness for prism-code#4: renders the template locks against a named
# SDK image on THIS branch and uploads the patch. Opens no pull request.
name: pc4 render test

on:
  workflow_dispatch:
    inputs:
      action-reference:
        required: true
        type: string
      sdk-image:
        required: true
        type: string
      template-revision:
        required: true
        type: string

permissions: {}

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          repository: UOR-Foundation/template
          ref: ${{ inputs.template-revision }}
          path: .template-policy
      - name: Render the locks from immutable inputs (same steps as template-update.yml)
        env:
          ACTION_REFERENCE: ${{ inputs.action-reference }}
          SDK_IMAGE: ${{ inputs.sdk-image }}
          TEMPLATE_REVISION: ${{ inputs.template-revision }}
        shell: bash
        run: |
          set -euxo pipefail
          [[ $SDK_IMAGE =~ ^[a-z0-9.-]+(:[0-9]{1,5})?/[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]
          [[ $ACTION_REFERENCE =~ ^UOR-Foundation/PrismPM/action@[0-9a-f]{40}$ ]]
          [[ $TEMPLATE_REVISION =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C .template-policy rev-parse HEAD)" = "$TEMPLATE_REVISION"
          for path in AGENTS.md VERIFICATION.md template-contract.json .github/workflows/bootstrap.yml; do
            install -D -m 0644 ".template-policy/$path" "$path"
          done
          platform_bundle=$(mktemp -d)
          docker buildx imagetools inspect --raw "$SDK_IMAGE" > "$platform_bundle/index.json"
          docker run --rm -i --user "$(id -u):$(id -g)" --network none \
            --cap-drop ALL --security-opt no-new-privileges --entrypoint node "$SDK_IMAGE" \
            /opt/prismpm/platform-lock.mjs index "$SDK_IMAGE" \
            < "$platform_bundle/index.json" > "$platform_bundle/children.txt"
          cat "$platform_bundle/children.txt"
          while read -r architecture child_ref; do
            mkdir "$platform_bundle/$architecture"
            docker pull --platform "linux/$architecture" "$child_ref"
            docker image inspect --format '{{json .}}' "$child_ref" > "$platform_bundle/$architecture/image.json"
            c=$(docker create --platform "linux/$architecture" "$child_ref")
            docker cp "$c:/opt/prismpm/share/inventory.json" "$platform_bundle/$architecture/inventory.json"
            docker cp "$c:/opt/prismpm/share/standards.lock" "$platform_bundle/$architecture/standards.lock"
            docker rm "$c" >/dev/null
          done < "$platform_bundle/children.txt"
          docker run --rm --user "$(id -u):$(id -g)" --network none --cap-drop ALL \
            --security-opt no-new-privileges \
            --volume "$PWD:/workspace" --volume "$PWD/.template-policy:/template-policy:ro" \
            --volume "$platform_bundle:/sdk-platforms:ro" --workdir /workspace --entrypoint node \
            "$SDK_IMAGE" /template-policy/bootstrap/render.mjs "$SDK_IMAGE" "$ACTION_REFERENCE" "$TEMPLATE_REVISION" /sdk-platforms
          rm -r -- .template-policy
          git status --short
      - name: prismpm template check / lock check / template update in the image
        if: always()
        env:
          SDK_IMAGE: ${{ inputs.sdk-image }}
          TEMPLATE_REVISION: ${{ inputs.template-revision }}
        shell: bash
        run: |
          set -uxo pipefail
          mkdir -p .pc4
          sdk() { docker run --rm --user "$(id -u):$(id -g)" --network none --cap-drop ALL \
            --security-opt no-new-privileges --volume "$PWD:/workspace" --workdir /workspace "$SDK_IMAGE" "$@"; }
          sdk prismpm --json template check > .pc4/template-check.json; echo "template check exit $?"; cat .pc4/template-check.json
          sdk prismpm --json lock check > .pc4/lock-check.json; echo "lock check exit $?"; cat .pc4/lock-check.json
          sdk prismpm --json template update --sdk-image "$SDK_IMAGE" --template-revision "$TEMPLATE_REVISION" > .pc4/template-update.json; echo "template update exit $?"; cat .pc4/template-update.json
          sdk prismpm --json check > .pc4/model-check.json; echo "model check exit $?"; cat .pc4/model-check.json
          sdk prismpm --version
          true
      - name: Capture the patch
        if: always()
        shell: bash
        run: |
          git add -N -- .devcontainer/devcontainer.json .github/workflows AGENTS.md VERIFICATION.md \
            prismpm.lock standards.lock template-contract.json template.lock
          git diff --check || true
          git diff --binary > .pc4/template-update.patch
          cp prismpm.lock template.lock standards.lock .pc4/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pc4-render-${{ github.sha }}
          path: .pc4/
          if-no-files-found: error
          retention-days: 7
