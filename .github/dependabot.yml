{
  "updates": [
    {
      "commit-message": {
        "prefix": "chore(deps)"
      },
      "directory": "/",
      "exclude-paths": [
        ".github/workflows/bootstrap.yml"
      ],
      "groups": {
        "pinned-actions": {
          "patterns": [
            "*"
          ]
        }
      },
      "ignore": [
        {
          "dependency-name": "UOR-Foundation/PrismPM/action"
        }
      ],
      "package-ecosystem": "github-actions",
      "schedule": {
        "interval": "monthly"
      }
    },
    {
      "commit-message": {
        "prefix": "chore(deps)"
      },
      "directory": "/",
      "groups": {
        "build-policy": {
          "patterns": [
            "*"
          ]
        }
      },
      "package-ecosystem": "cargo",
      "schedule": {
        "interval": "monthly"
      }
    }
  ],
  "version": 2
}
