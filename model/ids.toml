level = "build"
suite = "script"
statement = "A statement with too few or too many operands, including a line of more than five fields, is refused with line N wrong-arity (acceptance vector 15)."

[[id]]
id = "SC-08"
level = "build"
suite = "script"
statement = "A line with an empty field, from a doubled, leading or trailing space, is refused with line N empty-field before its command is read (acceptance vector 8)."

[[id]]
id = "SC-09"
level = "build"
