# model/ids.toml --- the conformance ID register.
#
# Every ID this repository claims, in one place, so that nothing is referenced
# without being defined. `CONFORMANCE.md` is generated from this file. A test
# whose name ends in an ID not listed here fails `check-model`, and an ID listed
# here with no scenario and no test fails it too (CM-02).
#
# `level` is the honesty level (R2):
#   some-true  a fact reproduced from an authority; not established here
#   build      constructed here and validated against its oracle
#   open       measured and reported, never asserted
#
# Every row here has a scenario in `features/suites/` and a test whose name ends
# in the ID, lowercased with underscores (R3, CM-02). There is no "pending"
# state: a capability that is not built does not get a row, and every row in this
# file is built.
#
# The register holds the command-line claims (suite `cli`), registered with
# the SDK's text command-line feature (PrismPM#204): the program is generated
# from the model, and these rows are what the repository asserts about it. The
# suites `script`, `admission`, `compliance` and `boundary` hold the claims
# about what the model's parser, admission gate, compliance check and request
# bounds do, each tested by running that generated program.

spec = "template/1"

[[id]]
id = "CL-01"
level = "build"
suite = "cli"
statement = "dataflow-policy check FILE, check - and check with the request on standard input print the same bytes for every acceptance vector within the request maximum, and those bytes equal the vector's modeled response."

[[id]]
id = "CL-02"
level = "build"
suite = "cli"
statement = "The exit status of dataflow-policy check is the model's code for the outcome the report begins with: 0 for status accepted, 1 for status rejected and 2 for status error."

[[id]]
id = "CL-03"
level = "build"
suite = "cli"
statement = "A request longer than the request maximum is refused before dispatch: standard output stays empty, standard error names InputLimit and the exit status is the code of the error outcome."

[[id]]
id = "CL-04"
