level = "build"
suite = "admission"
statement = "A pii mark on a node that is not an input is refused with line N not-an-input (acceptance vector 22); Interaction.markPiiAdmission with Core.gateAdmitsExactly backs it."

[[id]]
id = "AD-08"
level = "build"
suite = "admission"
statement = "An input marked as PII twice is refused with line N duplicate-pii (acceptance vector 23); Interaction.markPiiAdmission with Core.gateAdmitsExactly backs it."

[[id]]
