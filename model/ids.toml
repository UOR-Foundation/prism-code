statement = "A node whose kind is not input, operator, encrypt or output is refused with line N unknown-kind, ahead of the memory being read (acceptance vector 7)."

[[id]]
id = "SC-10"
level = "build"
suite = "script"
statement = "A node memory or memory limit that is not an unsigned 64-bit decimal is refused with line N invalid-number (acceptance vectors 16 and 17)."

[[id]]
id = "AD-01"
level = "build"
suite = "admission"
statement = "A node whose name is already declared is refused with line N duplicate-node, whatever its kind (acceptance vector 6); Interaction.addNodeAdmission with Core.gateAdmitsExactly says it is admitted exactly when admitNode admits it."

[[id]]
id = "AD-02"
level = "build"
suite = "admission"
statement = "An edge with an undeclared endpoint or a pii mark on an undeclared node is refused with line N unknown-node, and existence is checked before the self-edge rule (acceptance vector 5); Interaction.addEdgeAdmission and Interaction.markPiiAdmission with Core.gateAdmitsExactly back both cases."

[[id]]
id = "AD-03"
level = "build"
suite = "admission"
statement = "An edge from a node to itself is refused with line N self-edge, ahead of the rules about node kinds (acceptance vector 18); Interaction.addEdgeAdmission with Core.gateAdmitsExactly backs it."

[[id]]
id = "AD-04"
level = "build"
suite = "admission"
statement = "An edge declared twice is refused with line N duplicate-edge, while the reverse edge is a different edge (acceptance vector 19); Interaction.addEdgeAdmission with Core.gateAdmitsExactly backs it."

[[id]]
id = "AD-05"
level = "build"
suite = "admission"
statement = "An edge whose source is an output node is refused with line N output-source, whatever the target kind (acceptance vector 20); Interaction.addEdgeAdmission with Core.gateAdmitsExactly backs it."

[[id]]
id = "AD-06"
level = "build"
suite = "admission"
statement = "An edge whose target is an input node is refused with line N input-target (acceptance vector 21); Interaction.addEdgeAdmission with Core.gateAdmitsExactly backs it."

[[id]]
