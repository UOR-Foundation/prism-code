level = "build"
suite = "admission"
statement = "A second policy memory or a second policy encrypt-pii is refused with line N duplicate-policy, even with the same value or with the other policy between (acceptance vectors 24 and 25); Interaction.requireMemoryAdmission and Interaction.requirePiiEncryptionAdmission with Core.gateAdmitsExactly back it."

[[id]]
id = "AD-10"
level = "build"
suite = "admission"
statement = "The canonical form is the header, the policies with memory before encrypt-pii, the nodes sorted by name, the PII names sorted and the edges sorted by source then target, with names compared by bytes, so the shuffled script with a blank line (acceptance vector 2) and the sorted script (acceptance vector 3) give the same bytes."

[[id]]
id = "CP-01"
level = "build"
suite = "compliance"
statement = "A node whose memory exceeds the policy memory limit is reported as finding memory NODE USED exceeds LIMIT and a node at the limit is not (acceptance vector 4); Compliance.oversizedPipelineDetected proves an oversized pipeline is not compliant."

[[id]]
id = "CP-02"
level = "build"
suite = "compliance"
statement = "PII that reaches an output node without passing an encrypt node is reported as finding plaintext-pii NODE, and a project where PII reaches two outputs, one through encrypt and one not, reports exactly one such finding (acceptance vector 30); Compliance.bypassedPipelineDetected proves a bypass is detected and Compliance.encryptedPipelineCompliant proves the encrypted pipeline is compliant."

[[id]]
id = "CP-03"
level = "build"
suite = "compliance"
statement = "Findings are printed with every memory finding before every plaintext-pii finding, and each kind in order of node name bytes, whatever the order of the statements (acceptance vector 4); Compliance.findings builds the list and Compliance.sortFindings orders it."

[[id]]
id = "CP-04"
level = "build"
suite = "compliance"
statement = "A project is accepted only if it has no finding, a project with a finding is rejected, and a run that fails on a line is an error and never accepted; Engine.certifyRequiresCompliance, Engine.completedRunAcceptedOnlyIfCompliant and Engine.failedRunNeverAccepted prove it."

[[id]]
id = "CP-05"
level = "build"
suite = "compliance"
statement = "A policy that the script does not declare produces no finding: no memory policy means no memory finding and no encrypt-pii policy means no plaintext-pii finding, so the project is accepted; Engine.certifyRequiresCompliance says an empty list of findings is accepted."

[[id]]
id = "BD-01"
