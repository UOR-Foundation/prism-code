[[id]]
id = "PA-01"
level = "build"
suite = "parity"
statement = "For every acceptance vector, the response bytes that prismpm verify holds the Core-Wasm entry and the browser view to equal what the generated command line prints, and a vector the command line refuses before or instead of dispatch is compared by that refusal; verification evidence that attests the program under test must exist, and a changed command-line output fails the comparison."

[[id]]
id = "SC-01"
level = "build"
suite = "script"
statement = "Interaction.parseNodeFields reads node NAME KIND MEMORY for each of the kinds input, operator, encrypt and output, and the generated program accepts a script of such a statement and prints it back as its canonical form."

[[id]]
id = "SC-02"
level = "build"
suite = "script"
statement = "Interaction.parseEdgeFields reads edge SOURCE TARGET, and the generated program accepts a script that connects two declared nodes and prints the edge in its canonical form."

[[id]]
id = "SC-03"
level = "build"
suite = "script"
statement = "Interaction.parsePiiFields reads pii NAME, and the generated program accepts the mark on an input node, prints it in its canonical form and reports no finding while the encrypt-pii policy is absent."

[[id]]
id = "SC-04"
level = "build"
suite = "script"
statement = "Interaction.parsePolicyFields reads policy memory LIMIT, and the generated program accepts it, prints it first among the statements of the canonical form and does not count a node at the limit as over it."

[[id]]
id = "SC-05"
level = "build"
suite = "script"
statement = "Interaction.parsePolicyFields reads policy encrypt-pii with no operand, and the generated program accepts it and prints it in its canonical form."

[[id]]
id = "SC-06"
level = "build"
suite = "script"
statement = "A line whose command is not node, edge, pii or policy, or whose policy is not memory or encrypt-pii, is refused with line N unknown-command, where N counts blank lines (acceptance vector 14)."

[[id]]
