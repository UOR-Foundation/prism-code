statement = "An empty request is refused with request empty (acceptance vector 11)."

[[id]]
id = "BD-02"
level = "build"
suite = "boundary"
statement = "A request of exactly 4097 bytes is refused as request too-large (acceptance vector 13): the command line refuses it before dispatch with InputLimit, and the verification evidence holds the Core-Wasm entry and the browser view to the modeled report."

[[id]]
id = "BD-03"
level = "build"
suite = "boundary"
statement = "A request that is not valid UTF-8 is refused with request invalid-utf8, wherever the invalid byte is (acceptance vector 10)."

[[id]]
id = "BD-04"
level = "build"
suite = "boundary"
statement = "A request cannot exceed the 4097-line limit of request too-many-lines within the 4096-byte request maximum, because N bytes hold at most N newlines and N + 1 lines, so no acceptance vector produces it: the request of 4096 newlines has 4097 lines and is still split, and one byte more is refused as too large."

[[id]]
id = "BD-05"
level = "build"
suite = "boundary"
statement = "A request whose first line is not the script header is refused with line 1 missing-header, including a changed version, a trailing space, a different case and a blank first line (acceptance vector 9)."

[[id]]
id = "BD-06"
level = "build"
suite = "boundary"
statement = "A response cannot exceed the 16384-byte limit of response too-large from a request within the 4096-byte maximum, so no acceptance vector produces it: the densest request found, PII from one input to the most outputs over a memory limit of zero, gives a response under the limit."

[[id]]
id = "BD-07"
level = "build"
suite = "boundary"
statement = "A request of exactly 4096 bytes is accepted, and so is one byte fewer (acceptance vector 12)."

[[id]]
id = "QB-01"
level = "build"
suite = "budget"
statement = "The Core-Wasm guest prismpm build publishes is no larger than the byte threshold of measureGuestSize in the quality model, and a guest one byte over that threshold is refused; the measured size is reported beside the budget and is not itself a claim."

[[id]]
id = "QB-02"
level = "build"
suite = "budget"
statement = "The six-file browser closure prismpm build publishes is no larger in total than the byte threshold of measureClosureSize in the quality model; the measured size is reported beside the budget and is not itself a claim."

[[id]]
id = "QB-03"
level = "build"
suite = "budget"
statement = "The median of 11 runs of dataflow-policy check on the largest request the page dispatches through its form, process start included and each run giving the modeled response, is within the millisecond threshold of measureCliLatency in the quality model; the measured time is reported beside the budget and is not itself a claim."

[[id]]
id = "QB-04"
level = "build"
suite = "budget"
statement = "The browser dispatch-to-render time of the largest request the page dispatches through its form, as the median over the repetitions prismpm verify records in application-acceptance.json, is within the millisecond threshold of measureBrowserLatency in the quality model, and a time one millisecond over that threshold is refused; the measured time is reported beside the budget and is not itself a claim."
