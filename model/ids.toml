# model/ids.toml --- the conformance ID register.
#
# Every ID this repository claims, in one place, so that nothing is referenced
# without being defined. `CONFORMANCE.md` is generated from this file. A test
# whose name ends in an ID not listed here fails `check-model`, and an ID listed
# here with no scenario and no test fails it too (CM-02).
#
# `level` is the honesty level (R2):
#   some-true  a fact reproduced from an authority; not established here
#   build      constructed here and validated against its oracle
#   open       measured and reported, never asserted
#
# Every row here has a scenario in `features/suites/` and a test whose name ends
# in the ID, lowercased with underscores (R3, CM-02). There is no "pending"
# state: a capability that is not built does not get a row, and every row in this
# file is built.
#
# The register holds the command-line claims (suite `cli`), registered with
# the SDK's text command-line feature (PrismPM#204): the program is generated
# from the model, and these rows are what the repository asserts about it.

spec = "template/1"

[[id]]
id = "CL-01"
level = "build"
suite = "cli"
statement = "prism-code check FILE, check - and check with the request on standard input print the same bytes for every acceptance vector within the request maximum, and those bytes equal the vector's modeled response."

[[id]]
id = "CL-02"
level = "build"
suite = "cli"
statement = "The exit status of prism-code check is the model's code for the outcome the report begins with: 0 for status accepted, 1 for status rejected and 2 for status error."

[[id]]
id = "CL-03"
level = "build"
suite = "cli"
statement = "A request longer than the request maximum is refused before dispatch: standard output stays empty, standard error names InputLimit and the exit status is the code of the error outcome."

[[id]]
id = "CL-04"
level = "build"
suite = "cli"
statement = "No Rust source in the repository implements dispatch, request parsing or report formatting; the command line is generated from the model."

[[id]]
id = "CL-05"
level = "build"
suite = "cli"
statement = "--help prints the model's purpose, statement reference, report format, status texts, recovery text for every error and finding code, example names and exit-code table, and exits 0."

[[id]]
id = "CL-06"
level = "build"
suite = "cli"
statement = "--version prints the model's cargoName and cargoVersion on one line, prism-code 0.1.0, and exits 0."

[[id]]
id = "CL-07"
level = "build"
suite = "cli"
statement = "examples lists the model's example names, examples NAME prints that script unchanged, and piping each script to check gives the report and exit status of the acceptance vector it is drawn from."

[[id]]
id = "CL-08"
level = "build"
suite = "cli"
statement = "Every guidance string, example and code explanation in the workbench model also appears in the --help or examples output."

[[id]]
id = "CL-09"
level = "build"
suite = "cli"
statement = "An unknown flag is refused with the UnknownFlag diagnostic on standard error, the model's usage code and empty standard output."

[[id]]
id = "CL-10"
level = "build"
suite = "cli"
statement = "A second operand is refused with the ExtraArgument diagnostic on standard error, the model's usage code and empty standard output."

[[id]]
id = "CL-11"
level = "build"
suite = "cli"
statement = "Running without a command is refused with the MissingCommand diagnostic on standard error, the model's usage code and empty standard output."

[[id]]
id = "CL-12"
level = "build"
suite = "cli"
statement = "An unknown command is refused with the UnknownCommand diagnostic on standard error, the model's usage code and empty standard output."

[[id]]
id = "CL-13"
level = "build"
suite = "cli"
statement = "An example name the model does not declare is refused with the UnknownExample diagnostic on standard error, the model's usage code and empty standard output."

[[id]]
id = "CL-14"
level = "build"
suite = "cli"
statement = "A request path that does not exist is refused with the InputMissing diagnostic on standard error, the model's I/O code and empty standard output."

[[id]]
id = "CL-15"
level = "build"
suite = "cli"
statement = "A request path that cannot be opened, here a symbolic link, is refused with the InputOpen diagnostic on standard error, the model's I/O code and empty standard output."

[[id]]
id = "CL-16"
level = "build"
suite = "cli"
statement = "A request path that is not a regular file is refused with the InputType diagnostic on standard error, the model's I/O code and empty standard output."

[[id]]
id = "CL-17"
level = "build"
suite = "cli"
statement = "A request that fails while it is being read is refused with the InputRead diagnostic on standard error, the model's I/O code and empty standard output."

[[id]]
id = "CL-18"
level = "build"
suite = "cli"
statement = "A report that cannot be written to standard output is refused with the OutputWrite diagnostic on standard error and the model's I/O code."
